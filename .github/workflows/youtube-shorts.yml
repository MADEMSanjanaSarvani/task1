name: YouTube Shorts Pipeline

on:
  schedule:
    # 13:00 UTC = 18:30 IST daily - one Short/day. Uploaded PRIVATE with a 24h
    # scheduled publish (see SHORTS_REVIEW_BUFFER_HOURS below), so there's a full
    # day to review each one in YouTube Studio before it goes public.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Least-privilege default - this job only calls external APIs and Postgres, it
# never needs to write to the repo.
permissions:
  contents: read

# Queue instead of running concurrently if one run is still uploading when the
# next cron fires - two overlapping runs could both grab the same candidate
# topic before either marks it 'used'. Never cancel-in-progress: a Short mid-
# upload should finish, not get killed by the next scheduled trigger.
concurrency:
  group: youtube-shorts-pipeline
  cancel-in-progress: false

jobs:
  publish-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - working-directory: scripts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          BG_MUSIC_URL: ${{ secrets.BG_MUSIC_URL }}
          SHORTS_REVIEW_BUFFER_HOURS: ${{ vars.SHORTS_REVIEW_BUFFER_HOURS || '24' }}
          SHORTS_MANUAL_REVIEW_COUNT: ${{ vars.SHORTS_MANUAL_REVIEW_COUNT || '5' }}
          RENDER_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python 05_youtube_shorts.py
